version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aidoc2md_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidoc2md}
      POSTGRES_USER: ${POSTGRES_USER:-aidoc2md}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidoc2md_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidoc2md} -d ${POSTGRES_DB:-aidoc2md}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aidoc2md_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidoc2md_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn contextforge.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-aidoc2md-super-secret-key-2026}
      - ALLOWED_HOSTS=*
      - POSTGRES_DB=${POSTGRES_DB:-aidoc2md}
      - POSTGRES_USER=${POSTGRES_USER:-aidoc2md}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aidoc2md_secure_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidoc2md_worker
    restart: unless-stopped
    command: celery -A contextforge worker -l info --concurrency=2
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-aidoc2md-super-secret-key-2026}
      - POSTGRES_DB=${POSTGRES_DB:-aidoc2md}
      - POSTGRES_USER=${POSTGRES_USER:-aidoc2md}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aidoc2md_secure_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aidoc2md_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
